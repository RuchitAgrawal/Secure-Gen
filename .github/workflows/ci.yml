name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v --tb=short

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  dataset-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate dataset JSON
        run: |
          python -c "
          import json, pathlib, sys
          errors = []
          for p in pathlib.Path('datasets').rglob('*.json'):
              try:
                  data = json.loads(p.read_text())
                  assert isinstance(data, list), f'{p}: expected list'
                  for item in data:
                      assert 'id' in item, f'{p}: missing id field'
              except Exception as e:
                  errors.append(str(e))
          if errors:
              print('\n'.join(errors)); sys.exit(1)
          print('All datasets valid')
          "
