name: Security Scanning

on:
  schedule:
    - cron: '0 4 * * 1'
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  static-security-analysis:
    name: Bandit AST Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Bandit
        run: pip install bandit
      - name: Run Bandit on CLI code
        run: bandit -r cli/securegen -ll -ii
