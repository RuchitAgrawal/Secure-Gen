[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secure-gen"
version = "0.1.0"
description = "LLM red-teaming and benchmarking framework for security researchers"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "RuchitAgrawal" }]
keywords = ["security", "llm", "red-teaming", "benchmarking", "ai-security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "typer>=0.12.5",
  "rich>=13.8.0",
  "httpx>=0.27.2",
  "openai>=1.51.0",
  "anthropic>=0.34.2",
  "google-generativeai>=0.8.2",
  "pyyaml>=6.0.2",
  "jinja2>=3.1.4",
  "aiofiles>=24.1.0",
  "aiosqlite>=0.20.0",
  "pydantic>=2.9.2",
  "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "bandit>=1.7.8",
  "ruff>=0.5.0",
]

[project.scripts]
securegen = "securegen.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["securegen"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
