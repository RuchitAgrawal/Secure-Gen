models:
  - provider: openai
    model: gpt-4o
    temperature: 0.0
    max_tokens: 2048
    timeout: 60

  - provider: anthropic
    model: claude-3-5-sonnet-20241022
    temperature: 0.0
    max_tokens: 2048
    timeout: 60

  - provider: google
    model: gemini-1.5-pro
    temperature: 0.0
    max_tokens: 2048
    timeout: 60

runs:
  output_dir: runs
  concurrency: 5

attack:
  datasets:
    - datasets/prompt_injections/direct.json
    - datasets/prompt_injections/data_extraction.json
    - datasets/prompt_injections/tool_abuse.json
    - datasets/jailbreaks/roleplays.json
  min_severity: medium

benchmark:
  datasets:
    - datasets/security_tasks/vuln_detection.json
    - datasets/security_tasks/cve_triage.json
    - datasets/security_tasks/sast_triage.json
    - datasets/security_tasks/threat_modeling.json

report:
  output_dir: reports/output
  default_format: md
